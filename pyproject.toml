[project]
name = "aps"
version = "0.1.0"
description = "Monocular vision perception and forward-collision-warning stack, evaluated against LiDAR ground truth."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.7",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
detect = ["torch>=2.0", "torchvision>=0.15", "ultralytics>=8.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aps*"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "legacy/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN201", "ANN001"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
