# Publish site/ to GitHub Pages.
#
# The site used to live only on a detached `gh-pages` branch, edited by hand and
# never seen by a test, a linter or a review. That is how a page advertising a
# "TOP-DOWN RADAR", a MiDaS depth toggle and a localhost API stayed published for
# two months while the repository it described contained none of those things.
#
# The source now lives in `site/` on main, tests/test_site.py runs over it, and
# this workflow deploys it. The gate below is the point: if the site's scope
# language or its numbers fall out of step with docs/benchmarks.md, the deploy
# fails rather than publishing the drift.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/benchmarks.md"
      - "tests/test_site.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two versions at once, and let a newer commit supersede an
# in-flight deploy rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Audit the site against the benchmarks
        run: python -m pytest tests/test_site.py -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
