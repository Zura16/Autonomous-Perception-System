# Camera mounting and object priors for the monocular range estimators.
#
# Every value here is measured or sourced, never assumed, and every prior
# carries its spread (CLAUDE.md hard rule 6: a prior without a variance is a
# guess wearing a lab coat).

# ── Camera height above the road ─────────────────────────────────────────────
# MEASURED by fitting the road plane to LiDAR returns (aps/groundplane.py) over
# 134 val frames. LiDAR is ground truth here, never an input to the estimator --
# the estimator uses this single fixed nominal, exactly as a deployed system
# with no LiDAR would.
camera:
  height_m: 1.655        # val mean; std 0.027 m, range 1.583..1.745
  height_std_m: 0.027    # 1.6% -> a 1.6% range error floor for contact-point
  pitch_deg: 0.0         # FLAT-GROUND ASSUMPTION. Deliberately not corrected.

# ── Measured pitch, which the flat-ground assumption above ignores ───────────
# Camera-to-road pitch from the same plane fits. This is the RIGHT quantity:
# OXTS reports vehicle pitch in the navigation frame, which includes road grade
# and overstated this by 2-3x (docs/decisions.md D-009, D-016).
#
# Recorded here so the sensitivity analysis uses the real distribution rather
# than a hypothetical sweep. NOT read by the estimator.
measured_pitch:
  mean_deg: 0.150
  std_deg: 0.319
  abs_p95_deg: 0.715
  abs_max_deg: 0.937
  n_frames: 134
  caveat: >
    Measured on drives containing no hard braking. The ego vehicle pitches most
    under exactly the deceleration an FCW system exists for, so this is a floor
    on the operational distribution, not the whole of it.

# ── Object height priors ─────────────────────────────────────────────────────
# Priors are set on DEV and applied to VAL. Setting them from val and then
# evaluating on val would be leakage, and would report a prior that had already
# seen its own test set.
#
# The pooled-group priors are the operative ones: detection is class-agnostic
# with only a vehicle/VRU split (D-014), so the estimator genuinely cannot know
# whether a box holds a hatchback or a van. Its prior must span both, and the
# pooled spread is the honest input -- 20.1% for vehicles, not the 8.2% a
# Car-only prior would suggest.
priors:
  vehicle:
    height_m: 1.585          # dev, N=9 pooled Car+Van
    height_std_m: 0.390      # CV 24.6% on dev; val measures 20.1%
    source: "dev split tracklet dimensions (2011_09_26_drive_0013)"
    transfer_error_pct: -0.6 # dev 1.585 vs val 1.595 -- systematic range bias
  vru:
    height_m: 1.700          # adult standing stature; dev has NO VRU labels
    height_std_m: 0.147      # val-measured spread, used for the budget only
    source: "nominal adult stature; dev contains zero pedestrians or cyclists"
    transfer_error_pct: 0.4  # nominal 1.700 vs val 1.694

# ── Contact-point validity ───────────────────────────────────────────────────
contact_point:
  # A box whose bottom edge is within this many rows of the image edge is
  # treated as clipped, and BOTH estimators abstain on it.
  #
  # Was 2, which only caught boxes literally touching the last rows. The
  # objects that break the near field sit at y2 ~ 371 of 375 -- four pixels
  # clear, so they passed -- with a true range of ~4 m.
  #
  # WHY THEY BREAK. The ground contact point of an object at range D projects
  # to row cy + f*h/D, which leaves a 375-row image below
  #
  #     D_min = f*h / (H_img - cy) = 5.91 m
  #
  # so for anything closer the contact point is NOT IN THE PICTURE. The box
  # bottom can only reach the frame edge, and the estimator saturates: measured
  # estimates for sub-5.91 m objects cluster at 6.03 m (val) / 6.02 m (test)
  # against the 5.91 m prediction, and are over-estimates 100% of the time on
  # both splits. Size-prior fails there too, and slightly worse, because the
  # same edge truncates the box HEIGHT.
  #
  # This cannot be detected from the estimate: saturation puts it at or above
  # D_min by construction. The observable is the box's distance from the edge,
  # and the margin covers how far short of the edge the detector regresses a box
  # for an object running off-frame -- a measured detector property, not a
  # geometric one.
  #
  # SET ON VAL ONLY, then reported on test. The two populations separate
  # cleanly: unsupportable objects sit a median 4 px from the edge, valid ones
  # 140 px. At 10 px the gate catches 83% of unsupportable boxes and costs 19 of
  # 5548 valid ones (0.34%). val 0-10 m MAPE: contact-point 21.0 -> 12.4%,
  # size-prior 29.5 -> 19.9%; every other bin is untouched (zero boxes dropped).
  # See D-026.
  min_rows_from_bottom: 10
  # Below this, the object is at or above the horizon and the range diverges.
  # This is a NUMERICAL floor only -- it stops a division by zero. It is not a
  # statement about where the estimator is trustworthy; `max_range_m` is.
  min_pixels_below_horizon: 3
  # The estimator abstains beyond the range at which it has been characterised.
  #
  # Range is f*h / (v_bottom - v_horizon), so a one-pixel error on the box's
  # bottom edge costs 1/(v_bottom - v_horizon) in fractional range. At the 3 px
  # numerical floor that is 33% per pixel and the formula will happily return
  # 398 m -- eight times the furthest range this project has ever measured.
  #
  # 50 m is the evaluation envelope declared in D-015 (bounded by evidence: the
  # 50+ bin holds 30 usable samples). Past it the estimator is extrapolating
  # beyond any data that could contradict it, so it returns NaN instead, per
  # hard rule 14: abstaining is required, filling it in is a fabrication.
  # At 50 m the denominator is 23.9 px and one pixel costs 4.2% -- already the
  # limit of what a 10-15% MAPE claim can absorb. See D-025.
  max_range_m: 50.0

# ── Credible operating envelope ──────────────────────────────────────────────
# The band where range error stays within the stated bound **on both splits**,
# not just the one it was developed on. A MEASURED result (Rows 3.1, 9.7), read
# here rather than hardcoded in the HUD so a display can never vouch for a band
# the evaluation does not.
#
# It moved OUTWARD after D-025: the previous 10-30 m at <=15% was declared on
# val alone and did not survive the held-out split (17.2% at 10-20 m). The band
# below holds on val AND test.
#
# Note what this means and do not soften it: the near field is NOT in the
# envelope. A forward-collision system's range is least trustworthy exactly
# where a collision is most imminent. That is the finding, not a presentation
# problem to be styled away.
credible_envelope:
  min_range_m: 20.0
  max_range_m: 50.0
  max_mape_pct: 13.0
  # TTC is deliberately NOT gated by this band. It is measured separately and
  # is unbiased where it matters (median +0.01 s at GT TTC < 3 s, D-022),
  # because the scale-rate ratio cancels the box bias that drives range error.
  # Blanking TTC on a range criterion would suppress this project's most
  # trustworthy output on the strength of a different quantity's failure.
  gates_ttc: false
